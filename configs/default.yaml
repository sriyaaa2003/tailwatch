# tailwatch default configuration. Every tunable in the project lives here.
# Loaded and type-validated by tailwatch.config.load_config(); changing a value needs no code change.
seed: 7

paths:
  data_dir: data
  results_dir: results

city:
  grid_rows: 6
  grid_cols: 8
  # Districts are vertical column bands [col_start, col_end). Profiles differ on purpose so that
  # leave-one-district-out generalisation is a real test and not a relabelling of one distribution.
  districts:
    - {name: residential, col_start: 0, col_end: 2, n_sources: 55, rate_mean_mbps: 2.0, rate_sigma: 0.8, on_alpha: 1.5, off_alpha: 1.3, target_mean_util: 0.42}
    - {name: business,    col_start: 2, col_end: 4, n_sources: 70, rate_mean_mbps: 3.0, rate_sigma: 0.6, on_alpha: 1.6, off_alpha: 1.4, target_mean_util: 0.45}
    - {name: leisure,     col_start: 4, col_end: 6, n_sources: 45, rate_mean_mbps: 4.0, rate_sigma: 1.0, on_alpha: 1.3, off_alpha: 1.2, target_mean_util: 0.40}
    - {name: transit,     col_start: 6, col_end: 8, n_sources: 60, rate_mean_mbps: 2.5, rate_sigma: 0.9, on_alpha: 1.4, off_alpha: 1.25, target_mean_util: 0.43}

sim:
  duration_s: 14400
  on_min_s: 2.0
  off_min_s: 6.0
  capacity_jitter_sigma: 0.10
  diurnal_amplitude: 0.15
  diurnal_period_s: 14400
  rsrp_base_dbm: -82.0
  rsrp_util_slope_db: -28.0
  rsrp_noise_db: 1.5
  # Scripted demand surges (stadium letting out, train arrival). The surge adds `extra_source_factor` x n_sources
  # extra ON/OFF sources to the district's cells, ramped in and out linearly.
  events:
    - {district: leisure,     start_s: 3000, duration_s: 900, ramp_s: 240, extra_source_factor: 0.55}
    - {district: transit,     start_s: 6200, duration_s: 600, ramp_s: 120, extra_source_factor: 0.60}
    - {district: business,    start_s: 9000, duration_s: 1200, ramp_s: 300, extra_source_factor: 0.40}
    - {district: residential, start_s: 11800, duration_s: 900, ramp_s: 240, extra_source_factor: 0.50}
    - {district: leisure,     start_s: 12600, duration_s: 600, ramp_s: 120, extra_source_factor: 0.45}

storm:
  utilisation_threshold: 1.1   # demand/capacity at or above which a cell is congested (1.1 = demand 10% over capacity)
  horizon_s: 30                 # a "storm" label = onset of congestion within the next horizon_s seconds
  # Rows already congested are excluded: the task is forecasting onset, not persistence.

features:
  windows_s: [10, 30, 60]
  stride_s: 5                   # keep one decision point every stride_s seconds per cell

model:
  max_iter: 150
  learning_rate: 0.08
  max_leaf_nodes: 31
  min_samples_leaf: 40
  smote_ratio: 0.3              # minority/majority ratio after resampling
  undersample_ratio: 0.3
  val_fraction: 0.25            # last fraction of time inside training districts, used for threshold + calibration
  purge_s: 120                  # gap between train and val to stop window overlap leaking
  strategies: [none, class_weight, smote, undersample]
  default_strategy: class_weight
  val_mode: time                # twin: validation = last val_fraction of time inside training districts

eval:
  n_boot: 300
  block_s: 600                  # block-bootstrap unit (per cell, per block_s seconds) respects autocorrelation
  ci_level: 0.95
  reliability_bins: 10

probabilistic:
  alpha: 0.2                    # target miscoverage -> 80% prediction intervals
  quantile_max_iter: 120

selection:
  ks: [3, 6, 10, 16]
  l1_c: 0.05
  mi_subsample: 30000

policy:
  cost_miss: 20.0               # cost of a missed congestion onset (users suffer)
  cost_false_alarm: 1.0         # cost of a needless capacity pre-allocation
  threshold_grid: 99

generalization:
  random_test_fraction: 0.3
  temporal_test_fraction: 0.3
  protocols: [random, temporal, unseen, unseen_future]

hurst:
  validate_cells: 6
  min_scale_s: 8
  max_scale_div: 8

scale:
  multipliers: [1, 10, 100]
  base_cells: 48
  base_duration_s: 3600
  window_s: 30
  engines: [pandas, polars, duckdb]
  timeout_s: 600           # per run; a run that exceeds it is recorded as a timeout
  repeats: 3               # each timing is the median of this many warm runs

radar:
  strategy: class_weight
  variant: isotonic
  lead_s: 300
  window_s: 1200
  event_index: 0

report:
  group_label: district
  kind: twin
  event_label: storm
  peak_label: peak utilisation

# ---------------------------------------------------------------------------------------------------------------
# Real-trace study on msData (Open RAN 5G testbed, OpenIreland). Run with `tailwatch real`.
# Source: https://huggingface.co/datasets/subinak/Open_RAN_Performance_Measurement_Dataset_with_Traffic_and_Mobility_Labels
# Licence: MIT on the dataset card, CC BY 4.0 in the msData paper (arXiv 2603.16497); both require attribution, see README.
real:
  url: https://huggingface.co/datasets/subinak/Open_RAN_Performance_Measurement_Dataset_with_Traffic_and_Mobility_Labels/resolve/main/5G_millisecond.csv
  expected_bytes: 794453804
  filename: 5G_millisecond.csv
  data_dir: data/real
  results_dir: results/real
  group_col: mob_pattern        # car / bus / train / static / pedestrian are held out as whole groups
  timestamp_ticks_per_s: 100000 # 10 microsecond ticks: epoch seconds x 1e5 (inferred, not documented)
  bin_s: 1.0
  max_gap_s: 3.0
  min_stream_s: 120
  rate_unit_bps: 1000000.0      # mac_dl_brate is bit/s, load is expressed in Mbit/s
  storm_mbps: 10.0              # configured high-load level, about the 99.3rd percentile of 1 s cell load (0.7% of bins)
  horizon_s: 10
  windows_s: [5, 15, 30]
  stride_s: 2
  n_boot: 100
  block_s: 60
  hurst_min_stream_s: 300
  hurst_min_scale_s: 4
  hurst_max_scale_div: 6
  twin_few_sources: 4           # sources per cell for a testbed-sized twin (the real cell serves at most 4 UEs)
  storm_tail_labels: [dos-hulk-C, ddos-ripper-C, slowloris-C, portscan, youtube, Web Browsing, SIPP, iot]
